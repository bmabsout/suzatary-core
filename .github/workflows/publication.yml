# THE DEPLOY'S BUILDS, MADE ON GITHUB'S RUNNERS (2026-10-20). Every commit of
# suzatary-core's master is a publication (scripts/train.sh publish), and a
# deploy pins one. This workflow builds, for the box's system (aarch64-linux),
# what scripts/app-builds.sh builds from that tree, the app, the web bundle
# and the plugins, and pushes their closures to the `bmabsout` Cachix, which
# the box substitutes from. scripts/deploy.sh waits, bounded, for this run on
# the commit it pins, so the deploy downloads what this run built; when the
# run failed or never came, the deploy builds on the box and says so.
#
# The operator's shell (`.#triage`), the fourth thing app-builds.sh builds, is
# left out: it is nixpkgs' packages, which come from cache.nixos.org, and one
# unfree package this cache must not redistribute. So is the Android portal:
# its build bakes in the box's name and Firebase project, read from the
# environment under --impure, and is built in the private repository alone.
# Every build here is pure, so nothing of the deployment reaches the cache.
#
# WHO REACHES THE CACHE'S TOKEN. Only a push to master runs this, and only in
# the public repository (the private one carries the same file and skips it).
# A pull request never runs it, and the token is handed to the last step
# alone, after every build, so nothing the builds run sees it. The token is a
# secret of the environment `cachix`, which only a run on master may enter,
# so a workflow file a gate branch carries cannot name it either. This is the
# one workflow that writes to the cache: the gate's jobs only read it.
name: Publication cache

on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  cache:
    if: ${{ !github.event.repository.private }}
    # The token is this environment's secret, and only a run on master enters
    # it (scripts/core-settings.sh), so no other branch's workflow can read it.
    environment: cachix
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - name: Checkout the publication
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@2126ae7fc54c9df00dd18f7f18754393182c73cd # v31.9.1
        with:
          extra_nix_config: |
            extra-substituters = https://bmabsout.cachix.org
            extra-trusted-public-keys = bmabsout.cachix.org-1:/GhCEayGQ3NHMIlJiUelQrLtHHXVdGjHtyDz32xNAo4=

      # The attributes scripts/app-builds.sh builds, from the same tree: the
      # store path of a checkout is the path the box fetches the pinned commit
      # to, so every output here is the one a deploy asks for.
      - name: Build what a deploy builds
        run: |
          set -euo pipefail
          nix build --print-build-logs --out-link result-bin .#suzatary
          nix build --print-build-logs --out-link result-dist .#suzatary-web
          nix build --print-build-logs --out-link result-plugins .#suzatary-plugins

      # What the push adds to the cache: every path of the three closures that
      # neither cache.nixos.org nor the cache already serves, by its NAR size
      # (an upper bound of what Cachix stores, which compresses it). The
      # `bmabsout` cache holds 5 GB on Cachix's free plan and evicts the least
      # recently used past it, the Prodrome's builds among them, so a
      # publication that would add more than 1 GB fails here and pushes
      # nothing; the deploy then builds on the box, and says so. A query that
      # fails counts its path as unserved, so it errs toward failing.
      - name: Measure what the push adds
        env:
          LIMIT: 1000000000
        run: |
          set -euo pipefail
          nix path-info --recursive ./result-bin ./result-dist ./result-plugins | sort -u >closure.txt
          # A path is served when its cache answers its narinfo.
          for cache in https://cache.nixos.org https://bmabsout.cachix.org; do
            # shellcheck disable=SC2016
            xargs -P 16 -I '{}' sh -c 'name="${1#/nix/store/}"; curl -sfI -o /dev/null "$0/${name%%-*}.narinfo" && echo "$1"' "$cache" '{}' <closure.txt || true
          done | sort -u >served.txt
          comm -23 closure.txt served.txt >unserved.txt
          bytes="$(xargs -r nix path-info --size <unserved.txt | awk '{ sum += $2 } END { print sum + 0 }')"
          echo "the push adds $(wc -l <unserved.txt) paths, $((bytes / 1000000)) MB uncompressed"
          if ((bytes > LIMIT)); then
            echo "::error::this publication would add $((bytes / 1000000)) MB to the bmabsout Cachix, over the $((LIMIT / 1000000)) MB one publication may add to its 5 GB: nothing pushed"
            exit 1
          fi

      # cachix from the flake's own pinned nixpkgs, pushing the paths measured
      # above. The rest of their closures is served already, and cachix leaves
      # out what either cache serves.
      - name: Push the builds to the cache
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          xargs -r nix run --inputs-from . nixpkgs#cachix -- push bmabsout <unserved.txt
          echo "pushed $(wc -l <unserved.txt) paths"
