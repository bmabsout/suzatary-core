name: Cargo target
description: >
  Restore or keep the check job's compiled dependencies (app/target and cargo's
  sources), keyed by everything that decides them, and set the flags they
  were built with.

# WHAT IS KEPT IS THE DEPENDENCIES. A checkout stamps every file with the time
# it was written, so cargo rebuilds this workspace's own crates on every run
# whatever the target holds; their artifacts are dropped before saving, and
# what the entry carries is the third-party build, which cargo identifies by
# package and version, never by a file's time. So an entry cannot make a
# stale crate look fresh: the worst it can be is incomplete, and cargo builds
# what it lacks.
#
# The key names what decides that build: the lock, the toolchain and shell
# (flake.lock, flake.nix), the flags (.github/cargo-ci.toml, installed here
# as cargo's own configuration so every step reads the same ones) and the
# commands (the workflow). A miss
# restores the nearest older entry, and the job saves under
# the new key only once its compile step has succeeded, so a half-built
# target is never kept under a key that would then always hit.
inputs:
  mode:
    description: '`restore` or `save`.'
    required: true
  hit:
    description: When saving, the `hit` output of the restore.
    required: false
    default: 'false'
outputs:
  hit:
    description: Whether the exact key was restored.
    value: ${{ steps.restore.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - id: key
      shell: bash
      run: |
        echo "prefix=target-${{ runner.os }}-" >> "$GITHUB_OUTPUT"
        echo "key=target-${{ runner.os }}-${{ hashFiles('app/Cargo.lock', 'flake.lock', 'flake.nix', '.github/cargo-ci.toml', '.github/workflows/quick.yml') }}" >> "$GITHUB_OUTPUT"

    - id: restore
      if: inputs.mode == 'restore'
      uses: actions/cache/restore@v4
      with:
        path: |
          app/target
          ~/.cargo/registry
          ~/.cargo/git
        key: ${{ steps.key.outputs.key }}
        restore-keys: ${{ steps.key.outputs.prefix }}

    - if: inputs.mode == 'restore'
      shell: bash
      run: |
        mkdir -p ~/.cargo
        cp .github/cargo-ci.toml ~/.cargo/config.toml

    # The workspace's own targets, by the names cargo gives their files. A
    # name this misses is bytes kept, never a wrong answer: deleting from a
    # cache only lowers what it knows.
    - if: inputs.mode == 'save' && inputs.hit != 'true'
      shell: bash
      run: |
        names=$(nix develop .#rust --command \
          cargo metadata --manifest-path app/Cargo.toml --no-deps --offline --format-version 1 |
          jq -r '.packages[] | .name, (.targets[].name | ., gsub("-"; "_"))' | sort -u)
        for dir in app/target/*/; do
          for name in $names; do
            rm -rf "$dir".fingerprint/"$name"-* "$dir"build/"$name"-* \
              "$dir"deps/"$name"-* "$dir"deps/lib"$name"-* "$dir$name" "$dir$name".d
          done
          rm -rf "$dir"incremental "$dir"examples
        done
        rm -rf app/target/doc
        du -sh app/target

    - if: inputs.mode == 'save' && inputs.hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: |
          app/target
          ~/.cargo/registry
          ~/.cargo/git
        key: ${{ steps.key.outputs.key }}
