# The releases Suzatary ships, in order (CLAUDE.md, "Versioning").
#
# Each is a todo on `chain` whose spec composes its items (`Ref`s), and declares the
# `major.minor` it ships as. The version is `suzatary_core::release::Reading`'s: MAJOR.MINOR the
# last completed release's (`base`.0 before any), PATCH the trains since that MAJOR.MINOR was
# first tagged. Items show a release's progress and move no version. The versions strictly
# increase, or the plan is refused. A release is added at the end; one that has shipped is never
# moved or removed, since every earlier tag was read through it.
chain = "suzatary"
base = 1

[[release]]
todo = "suzatarytwo"
major = 2
minor = 0

[[release]]
todo = "suzatarytwoone"
major = 2
minor = 1

[[release]]
todo = "suzatarytwotwo"
major = 2
minor = 2

[[release]]
todo = "suzatarytwothree"
major = 2
minor = 3
