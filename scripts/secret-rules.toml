# THE LEAK GUARD'S SECRET RULES (scripts/public-tree.sh): gitleaks's own, maintained upstream,
# and only what this project adds to them. A rule is never turned off for a file: a fixture key a
# person vouched for is named by its finding's fingerprint in the tree's `.gitleaksignore`, and its
# bytes by their digest in `scripts/public-admitted.sha256`.

[extend]
useDefault = true

# A Claude subscription's token, as `claude setup-token` mints it for the box's model jobs
# (`CLAUDE_CODE_OAUTH_TOKEN`); the default rules know the API's keys and not this one.
[[rules]]
id = "anthropic-oauth-token"
description = "A Claude subscription's OAuth token"
regex = '''\b(sk-ant-oat01-[A-Za-z0-9_\-]{80,})'''
keywords = ["sk-ant-oat01-"]

# The render cache's key in a web vector is two content addresses (`web_vectors.rs` writes it), a
# line the generic rule reads as a key; the vector is regenerated too often to vouch for by digest.
# Keyed on the line's exact shape alone: the scanner reads every file under a neutral name.
[[allowlists]]
description = "a web vector's render key: two SHA-256 digests"
targetRules = ["generic-api-key"]
regexTarget = "line"
regexes = ['''^\s*"key": "[0-9a-f]{64} [0-9a-f]{64}"$''']

# A Go module checksum (`h1:` and a SHA-256 in base64) is random bytes the generic rule takes for
# a key; a go.sum line of that exact shape (a version is digits and `.+-` words, never a `=`) is
# no secret, wherever the file stands.
[[allowlists]]
description = "a go.sum line: a module, its version and its h1: checksum"
targetRules = ["generic-api-key"]
regexTarget = "line"
regexes = ['''^\s*[a-z0-9.!_~/-]+ v[0-9][0-9A-Za-z.+-]*(/go\.mod)? h1:[A-Za-z0-9+/]{43}=$''']
